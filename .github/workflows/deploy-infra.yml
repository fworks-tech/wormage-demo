name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish auth secret to SSM
        run: |
          if [ -z "$WORMAGE_AUTH_SECRET" ]; then echo "WORMAGE_AUTH_SECRET is required"; exit 1; fi
          aws ssm put-parameter --name "/wormage/auth/secret" --type SecureString --value "$WORMAGE_AUTH_SECRET" --overwrite --tier Standard --region us-east-1
        env:
          WORMAGE_AUTH_SECRET: ${{ secrets.WORMAGE_AUTH_SECRET }}
      - name: Publish GitHub bug-report token to SSM
        run: |
          if [ "$WORMAGE_GITHUB_ISSUES_ENABLED" = "true" ]; then
            if [ -z "$WORMAGE_GITHUB_TOKEN" ]; then
              echo "WORMAGE_GITHUB_TOKEN is required when GitHub issue creation is enabled"
              exit 1
            fi
            if [ "$WORMAGE_AUTH_MODE" != "enforce" ]; then
              echo "WORMAGE_AUTH_MODE=enforce is required when GitHub issue creation is enabled"
              exit 1
            fi
            aws ssm put-parameter --name "/wormage/github/bug-report-token" --type SecureString --value "$WORMAGE_GITHUB_TOKEN" --overwrite --tier Standard --region us-east-1
          fi
        env:
          WORMAGE_GITHUB_TOKEN: ${{ secrets.WORMAGE_GITHUB_TOKEN }}
          WORMAGE_GITHUB_ISSUES_ENABLED: ${{ vars.WORMAGE_GITHUB_ISSUES_ENABLED }}
          WORMAGE_AUTH_MODE: ${{ vars.WORMAGE_AUTH_MODE }}
      - name: Install root deps
        run: npm ci
      - name: Install infra deps
        working-directory: infra
        run: npm ci
      - name: Build
        working-directory: infra
        run: npm run build
      - name: Synth
        working-directory: infra
        run: npm run synth
        env:
          WORMAGE_HOSTED_ZONE_ID: ${{ vars.WORMAGE_HOSTED_ZONE_ID }}
          WORMAGE_HOSTED_ZONE_NAME: ${{ vars.WORMAGE_HOSTED_ZONE_NAME }}
          WORMAGE_CERTIFICATE_ARN: ${{ secrets.WORMAGE_CERTIFICATE_ARN }}
          WORMAGE_API_DOMAIN: ${{ vars.WORMAGE_API_DOMAIN }}
          WORMAGE_ALARM_EMAIL: ${{ vars.WORMAGE_ALARM_EMAIL }}
          WORMAGE_AUTH_MODE: ${{ vars.WORMAGE_AUTH_MODE }}
          WORMAGE_GITHUB_ISSUES_ENABLED: ${{ vars.WORMAGE_GITHUB_ISSUES_ENABLED }}
          WORMAGE_AUTH_SECRET: ${{ secrets.WORMAGE_AUTH_SECRET }}
      - name: Deploy
        working-directory: infra
        run: npx cdk deploy --require-approval never
        env:
          WORMAGE_HOSTED_ZONE_ID: ${{ vars.WORMAGE_HOSTED_ZONE_ID }}
          WORMAGE_HOSTED_ZONE_NAME: ${{ vars.WORMAGE_HOSTED_ZONE_NAME }}
          WORMAGE_CERTIFICATE_ARN: ${{ secrets.WORMAGE_CERTIFICATE_ARN }}
          WORMAGE_API_DOMAIN: ${{ vars.WORMAGE_API_DOMAIN }}
          WORMAGE_ALARM_EMAIL: ${{ vars.WORMAGE_ALARM_EMAIL }}
          WORMAGE_AUTH_MODE: ${{ vars.WORMAGE_AUTH_MODE }}
          WORMAGE_GITHUB_ISSUES_ENABLED: ${{ vars.WORMAGE_GITHUB_ISSUES_ENABLED }}
          WORMAGE_AUTH_SECRET: ${{ secrets.WORMAGE_AUTH_SECRET }}
