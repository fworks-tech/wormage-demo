name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Select affected tests
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ -n "$PR_BASE" ]; then
            node scripts/affected.mjs --base "$PR_BASE" --labels "$PR_LABELS"
          else
            node scripts/affected.mjs --full
          fi

      - run: npm run typecheck
      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        if: steps.scope.outputs.run_unit == 'true'
        env:
          # env keeps repo-controlled paths out of the shell parser
          UNIT_ARGS: ${{ steps.scope.outputs.unit_args }}
        run: npx vitest run $UNIT_ARGS

      - name: Install infra dependencies
        if: steps.scope.outputs.run_infra == 'true'
        run: npm --prefix infra ci

      - name: Infra tests
        if: steps.scope.outputs.run_infra == 'true'
        run: npm run test:infra

      - run: npm run build

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Browser tests
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$PR_LABELS," == *",ci:full,"* ]]; then
            npm run test:e2e
          else
            # Concurrent PixiJS matches can exhaust the hosted runner's fixed test budgets.
            PW_WORKERS=1 npm run test:smoke
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
